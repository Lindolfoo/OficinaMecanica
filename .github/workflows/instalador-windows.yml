# Gera o instalador .exe do Windows.
#
# Por que no GitHub e não na máquina de quem desenvolve: o jpackage NÃO faz
# compilação cruzada. Rodando no Linux ele produz .deb/.rpm, nunca .exe. Para
# gerar o instalador do Windows é preciso um Windows com o WiX Toolset — e é
# exatamente isso que o runner windows-latest oferece pronto.
#
# Resultado: um instalador que já traz o Java dentro (quem instala não precisa
# ter Java), cria atalho no menu Iniciar e na área de trabalho, e instala na
# pasta do usuário (sem pedir administrador).

name: Instalador Windows

on:
  push:
    tags: ['v*']            # a cada versão publicada
  workflow_dispatch:        # ou quando você mandar, pelo botão na aba Actions

# Necessário para o passo que anexa o .exe à Release: por padrão o token do
# Actions pode vir somente-leitura, e a publicação falharia no fim de tudo.
permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar o jar
        run: ./mvnw -B clean package

      - name: Descobrir a versão do pom
        id: versao
        shell: pwsh
        run: |
          $v = ([xml](Get-Content pom.xml)).project.version
          "numero=$v" >> $env:GITHUB_OUTPUT
          Write-Host "versão: $v"

      - name: Montar o instalador com jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path entrada | Out-Null
          Copy-Item target/oficina.jar entrada/

          jpackage `
            --type exe `
            --name "Oficina Mecanica" `
            --app-version ${{ steps.versao.outputs.numero }} `
            --input entrada `
            --main-jar oficina.jar `
            --main-class br.com.oficina.App `
            --dest instalador `
            --vendor "UNIP - DS4P-17" `
            --description "Sistema de Ordens de Servico para oficina mecanica" `
            --copyright "MIT" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-per-user-install `
            --java-options "-Xms32m" `
            --java-options "--enable-native-access=ALL-UNNAMED"

          Get-ChildItem instalador

      # --enable-native-access silencia o aviso do Java 25 ao carregar a
      # biblioteca nativa do SQLite. --win-per-user-install instala na pasta do
      # usuário: sem isso o programa cairia em C:\Program Files, onde o Windows
      # bloqueia gravação (o banco fica em %LOCALAPPDATA%, mas o instalador
      # também deixa de exigir administrador).

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: OficinaMecanica-instalador-windows
          path: instalador/*.exe
          retention-days: 90

      # Quando o disparo veio de uma tag, anexa o .exe à Release.
      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/*.exe

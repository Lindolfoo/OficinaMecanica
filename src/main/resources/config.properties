# Configuração padrão. Qualquer chave pode ser sobrescrita por variável de ambiente:
#   PORT, DB_URL, DB_USER, DB_PASSWORD, DB_AUTO_SCHEMA
server.port=8080
db.url=jdbc:mysql://localhost:3306/oficina?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
db.user=root
db.password=root
# true = executa sql/01_schema.sql na subida (idempotente). Use false se o usuário do banco não puder criar schema.
db.autoSchema=true

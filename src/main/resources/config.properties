# Configuração padrão. Qualquer chave pode ser sobrescrita por variável de ambiente:
#   HOST, PORT, OFICINA_DADOS, DB_URL, DB_AUTO_SCHEMA, DB_SEED_INICIAL,
#   SESSAO_MINUTOS, COOKIE_SEGURO, ADMIN_NOME, ADMIN_EMAIL, ADMIN_SENHA
# 127.0.0.1 = só este computador acessa. 0.0.0.0 = qualquer computador da rede.
server.host=127.0.0.1
server.port=8080

# ----------------------------------------------------------------------- banco
# O banco é um ARQUIVO SQLite. Não há servidor para instalar nem senha de banco.
# Vazio = a aplicação escolhe a pasta certa do sistema:
#   Windows  %LOCALAPPDATA%\OficinaMecanica\oficina.db
#   Linux    ~/.local/share/OficinaMecanica/oficina.db
#   macOS    ~/Library/Application Support/OficinaMecanica/oficina.db
# Não guarde o banco junto do programa: em C:\Program Files o Windows bloqueia a gravação.
db.pasta=
# true = executa sql/01_schema.sql na subida (idempotente).
db.autoSchema=true
# true = carrega sql/02_seed.sql quando o banco nasce vazio.
db.seedInicial=true

# ----------------------------------------------------------------- autenticação
# Minutos de inatividade até a sessão cair sozinha.
auth.sessaoMinutos=30
# true marca o cookie como Secure (só trafega em HTTPS). Em http://localhost precisa ficar false.
auth.cookieSeguro=false
# Administrador criado na PRIMEIRA execução, quando a tabela usuario ainda está vazia.
# TROQUE A SENHA ao entrar pela primeira vez.
auth.adminNome=Administrador
auth.adminEmail=admin@oficina.local
auth.adminSenha=oficina2026
